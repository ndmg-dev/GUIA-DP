# DNS interno do Docker — permite resolver "backend" em runtime.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API → proxy pro container do backend (mesma rede Docker) ──
    # Assim tudo vive no mesmo domínio, sem depender do roteamento por
    # path do Traefik e sem CORS. A URI (/api/...) é repassada intacta.
    location /api/ {
        set $backend_upstream http://backend:3333;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming NDJSON: desliga buffering pra os tokens saírem na hora.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: qualquer rota desconhecida volta ao index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
